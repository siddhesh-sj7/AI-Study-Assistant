<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | AI Student Assistant</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script defer src="/js/app.js"></script>
  </head>
  <body data-page="contact">
    <div data-nav></div>

    <main class="site-shell">
      <section class="page-header">
        <div class="container contact-grid">
          <article class="contact-card reveal">
            <div class="eyebrow">Contact</div>
            <h1 class="page-title">Get in touch</h1>
            <p class="page-subtitle">
              Share feedback, report an issue, or suggest a feature that would make the study assistant more useful.
            </p>

            <ul class="plain-list">
              <li><span class="dot"></span> Ask for new student tools</li>
              <li><span class="dot"></span> Report bugs or page issues</li>
              <li><span class="dot"></span> Suggest improvements for the dashboard</li>
            </ul>
          </article>

          <section class="contact-card reveal">
            <form class="stack" id="contactForm">
              <div class="field">
                <label for="contactEmail">Email</label>
                <input class="input" id="contactEmail" type="email" placeholder="student@example.com" required />
              </div>

              <div class="field">
                <label for="contactNotes">Message</label>
                <textarea class="textarea" id="contactNotes" placeholder="Type your message here..." required></textarea>
              </div>

              <button class="button full-width" type="submit">Send message</button>
              <div class="message" id="contactMessage"></div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <div data-footer></div>
  </body>
</html>
